manifest = 1

[plugin]
id = "hello"
name = "Hello"
version = "0.1.0"
api = "1.0"
description = "An example that uses every interface of the plugin API."
authors = ["AngelicaProject contributors"]

[permissions]
"files.replace" = true
"chat.commands" = true
"chat.print" = true
"http.get" = true
"http.websocket" = true
"draw.world" = true
"messages.send" = true
"clipboard.write" = true
"notifications" = true
"sound.play" = true
"storage.cache" = true

[http]
hosts = ["example.com"]

[storage]
cache = 1

[messages]
to = ["hello"]

[lens]
read = ["actions", "character", "chat", "location", "statuses", "windows"]
act = ["actions", "teleport", "windows"]
change = ["camera", "chat", "text", "windows"]
