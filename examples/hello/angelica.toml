manifest = 1

[plugin]
id = "hello"
name = "Hello"
version = "0.1.0"
api = "1.0"
description = "An example that uses every interface of the plugin API."
authors = ["AngelicaProject contributors"]

[permissions]
"excel.text" = true
"text.case" = true
"files.replace" = true
"chat.commands" = true
"chat.print" = true
"http.get" = true
"state.self" = true
"chat.read" = true
"gameui.hide" = true
"gameui.text" = true

[http]
hosts = ["example.com"]
