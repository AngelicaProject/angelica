[package]
name = "angelica-setup"
description = "The installer that puts Angelica beside the game."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "angelica-setup"
path = "src/main.rs"

[dependencies]
angelica-update.workspace = true
ed25519-dalek.workspace = true
egui.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["glow"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[build-dependencies]
serde_json.workspace = true
