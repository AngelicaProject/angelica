[workspace]
resolver = "3"
members = [
  "crates/angelica-pe",
  "crates/angelica-map",
  "crates/angelica-hook",
  "crates/angelica-text",
  "crates/angelica-sqpack",
  "crates/angelica-cli",
  "crates/angelica-plugin-installer",
  "crates/angelica-proxy",
  "crates/angelica-host",
  "crates/angelica-sdk",
  "crates/angelica-setup",
  "crates/angelica-update",
  "crates/angelica-fake-game",
  "crates/angelica-fake-game/hostile",
  "examples/hello",
  "examples/inventory",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/AngelicaProject/angelica"
authors = ["AngelicaProject contributors"]

[workspace.dependencies]
angelica-map = { path = "crates/angelica-map" }
angelica-pe = { path = "crates/angelica-pe" }
angelica-text = { path = "crates/angelica-text" }
angelica-sqpack = { path = "crates/angelica-sqpack" }
crc32fast = "1.5.2"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
angelica-hook = { path = "crates/angelica-hook" }
angelica-host = { path = "crates/angelica-host" }
angelica-sdk = { path = "crates/angelica-sdk" }
angelica-update = { path = "crates/angelica-update" }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
clap = { version = "4.5", features = ["derive"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder"] }
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3"
thiserror = "2.0.20"
toml = "1.1.6"
windows-sys = "0.61.2"
semver = "1.0.28"
wasmtime = { version = "49.0.2", default-features = false, features = ["std", "runtime", "cranelift", "component-model"] }
egui = { version = "0.36.2", default-features = false }
num-traits = "0.2.19"
windows = { version = "0.62.2", default-features = false }
ureq = { version = "=3.4.2", default-features = false, features = ["gzip"] }
native-tls = "0.2.18"
wit-bindgen = { version = "0.62.0", default-features = false, features = ["macros", "realloc", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

# Code in the game process catches panics at every boundary.
[profile.release]
panic = "unwind"

# Tests run plugins: dependencies, wasmtime's compiler above all, build
# optimized, while the workspace's own crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 2
