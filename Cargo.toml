[workspace]
resolver = "3"
members = [
  "crates/angelica-pe",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/AngelicaProject/angelica"
authors = ["AngelicaProject contributors"]

[workspace.dependencies]
memchr = "2.8.3"
thiserror = "2.0.20"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

# Code in the game process catches panics at every boundary.
[profile.release]
panic = "unwind"
