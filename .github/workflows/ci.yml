name: CI

# docs/development/ci.md describes what each job guarantees.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks. Runs on main
# are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: windows-latest
    # A hang fails the run instead of holding it for six hours.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy -p angelica-sdk -p angelica-hello -p angelica-hostile -p angelica-inventory --target wasm32-wasip2 --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  # The installer and game discovery for a game in Wine on Linux
  # (docs/architecture/installer.md), which the Windows job does not build.
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy -p angelica-games -p angelica-setup --all-targets --locked -- -D warnings
      - run: cargo test -p angelica-games -p angelica-setup --locked

  # The proxy, a game that imports it, and a signed test host, built on
  # Windows for the wine job.
  wine-fixture:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p angelica-proxy --test bootstrap --locked -- --ignored --exact wine_fixture
        env:
          ANGELICA_WINE_FIXTURE: ${{ runner.temp }}/wine-fixture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wine-fixture
          path: ${{ runner.temp }}/wine-fixture/
          if-no-files-found: error

  # In Wine, as on Linux, the proxy starts the host before the game's entry
  # point once the installer's dinput8 override is set
  # (docs/architecture/loading.md#in-wine).
  wine:
    needs: wine-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: debian:trixie@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
    steps:
      - name: Install Wine
        run: |
          dpkg --add-architecture i386
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wine wine64 wine32:i386
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wine-fixture
          path: wine-fixture/
      - run: sh crates/angelica-proxy/tests/wine.sh wine-fixture

  # Dependencies: known vulnerabilities, yanked crates, licenses, and sources
  # (deny.toml). Workflows: actionlint (with shellcheck) and zizmor.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,zizmor@1.30.1
      - run: cargo deny --locked check
      - name: Lint workflows
        run: |
          curl --fail --silent --show-error --location --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file actionlint.tar.gz actionlint
          ./actionlint
          zizmor --format github .github/workflows

  # The website: it builds, and every link inside it leads somewhere
  # (site/build.mjs). Publishing is pages.yml.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The site holds the Rust SDK's reference, which rustdoc builds.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip2
      - run: npm ci
      - run: node build.mjs

  # The plugin for coding agents (docs/plugins/agent-plugin.md): its
  # manifest, its skill, and the marketplace that lists it are valid.
  agent-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npx --yes @anthropic-ai/claude-code@2.1.301 plugin validate --strict ./agent-plugin
      - run: npx --yes @anthropic-ai/claude-code@2.1.301 plugin validate --strict .

  # The one check the main ruleset requires: it passes only when every job
  # above passed, so jobs can change without changing the ruleset.
  ci:
    if: always()
    needs: [rust, linux, wine-fixture, wine, supply-chain, site, agent-plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done
