name: Release

# Stable releases are published from version tags; the rolling nightly
# pre-release is rebuilt after every green CI run of a push to main. The
# release model is described in docs/development/releases.md.
#
# workflow_run runs with the release secrets, so it builds only pushes to
# main that passed CI, and the gate checks that the commit is main's head.
on: # zizmor: ignore[dangerous-triggers]
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  # A nightly is built only for the current head of main: CI for an older
  # merge can finish after a newer one landed.
  gate:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.head.outputs.build }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$COMMIT" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $COMMIT: main is now at $head"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    # A newer nightly supersedes one still building; stable releases never
    # cancel each other. Only a run that passed the gate can cancel another.
    concurrency:
      group: ${{ github.event_name == 'push' && format('release-{0}', github.ref_name) || 'release-nightly' }}
      cancel-in-progress: ${{ github.event_name == 'workflow_run' }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      ANGELICA_RELEASE_PUBLIC_KEY: ${{ vars.ANGELICA_RELEASE_PUBLIC_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.1

      - name: Require the release key
        run: |
          if ! [[ "$ANGELICA_RELEASE_PUBLIC_KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the repository variable ANGELICA_RELEASE_PUBLIC_KEY is not 64 hexadecimal digits"
            exit 1
          fi

      - name: Require a green main commit for stable releases
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main"
            exit 1
          fi
          for _ in $(seq 1 120); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&branch=main&event=push" \
              --jq '[.workflow_runs[] | "\(.status):\(.conclusion)"] | join(" ")')
            case " $runs " in
              *" completed:success "*) echo "CI passed on main for $COMMIT"; exit 0 ;;
            esac
            case "$runs" in
              *in_progress*|*queued*|*requested*|*waiting*|*pending*) sleep 30 ;;
              *) echo "::error::CI has not passed on main for $COMMIT (runs: ${runs:-none})"; exit 1 ;;
            esac
          done
          echo "::error::timed out waiting for CI on main for $COMMIT"
          exit 1

      # The declared version is [workspace.package] version in Cargo.toml.
      # A nightly is <next>-nightly.<run>, where <next> is the declared
      # version until it is tagged and the next patch version after.
      - name: Determine the version
        id: version
        run: |
          declared=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
              echo "::error::the tag $GITHUB_REF_NAME does not match the declared version $declared"
              exit 1
            fi
            version=$declared
            channel=stable
            tag=$GITHUB_REF_NAME
          else
            next=$declared
            if git rev-parse -q --verify "refs/tags/v$declared" > /dev/null; then
              IFS=. read -r major minor patch <<< "$declared"
              next="$major.$minor.$((patch + 1))"
            fi
            version="$next-nightly.$GITHUB_RUN_NUMBER"
            channel=nightly
            tag=nightly
            sed -i "/^\[workspace.package\]/,/^\[/s/^version = \".*\"/version = \"$version\"/" Cargo.toml
            cargo update --workspace
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Building Angelica $version ($channel)"

      - name: Build the proxy, the host, the plugin installer, and the tools
        env:
          ANGELICA_RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
        run: cargo build --release -p angelica-proxy -p angelica-host -p angelica-plugin-installer -p angelica-cli

      - name: Sign the release files
        env:
          ANGELICA_RELEASE_SIGNING_KEY: ${{ secrets.ANGELICA_RELEASE_SIGNING_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          mkdir -p dist
          cp target/release/runtime.dll target/release/plugin-installer.exe target/release/dinput8.dll dist/
          target/release/angelica.exe release sign dist/runtime.dll dist/plugin-installer.exe dist/dinput8.dll
          printf '{"version":"%s","channel":"%s"}\n' "$VERSION" "$CHANNEL" > dist/release.json

      - name: Build the installer with the signed files inside
        env:
          ANGELICA_RELEASE_CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          ANGELICA_SETUP_PAYLOAD="$(pwd)/dist" cargo build --release -p angelica-setup
          cp target/release/angelica-setup.exe dist/

      - name: Write the update feed
        env:
          ANGELICA_RELEASE_SIGNING_KEY: ${{ secrets.ANGELICA_RELEASE_SIGNING_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          target/release/angelica.exe release feed --product angelica --channel "$CHANNEL"             --version "$VERSION" --published "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --file dist/runtime.dll --file dist/plugin-installer.exe --file dist/dinput8.dll             --output dist/channel.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  # The installer for a game in Wine on Linux, with the same signed files
  # inside. An older Ubuntu keeps it running on older systems.
  linux:
    needs: windows
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      ANGELICA_RELEASE_PUBLIC_KEY: ${{ vars.ANGELICA_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.COMMIT }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.98.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows
          path: payload/
      - name: Build the installer with the signed files inside
        run: |
          ANGELICA_SETUP_PAYLOAD="$(pwd)/payload" cargo build --release --locked -p angelica-setup
          mkdir -p dist
          tar --create --gzip --file dist/angelica-setup-linux-x86_64.tar.gz             --directory target/release angelica-setup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    concurrency:
      group: ${{ github.event_name == 'push' && format('release-{0}', github.ref_name) || 'release-nightly' }}
      cancel-in-progress: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      VERSION: ${{ needs.windows.outputs.version }}
      TAG: ${{ needs.windows.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true
      - name: Write the checksums
        run: |
          rm dist/release.json
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish
        run: |
          if [ "$TAG" = "nightly" ]; then
            gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create nightly dist/* --repo "$GITHUB_REPOSITORY" --prerelease --target "$COMMIT"               --title "Nightly $VERSION"               --notes "Built from $COMMIT after CI passed on main. Nightly builds are for testers and may stop the game."
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Angelica $VERSION" --generate-notes --latest
          fi
